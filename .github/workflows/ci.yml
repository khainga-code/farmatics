name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Embedded Postgres runs in-process; one worker at a time keeps memory
      # predictable on a small runner.
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Serially, one package at a time. PGlite allocates large buffers, and
      # parallel suites are what exhausted this machine during Phase 3.
      - name: Shared rules
        run: pnpm --filter @farmatics/shared test

      - name: Migrations and database rules
        run: pnpm --filter @farmatics/db test

      - name: Sync engine
        run: pnpm --filter @farmatics/sync test

      - name: API
        run: pnpm --filter @farmatics/api test

      - name: Web
        run: pnpm --filter @farmatics/web test

      - name: Production web build
        env:
          # The build refuses to run without an API origin. This value is only
          # baked into the CI bundle and never deployed.
          VITE_API_URL: https://api.example.test
        run: pnpm --filter @farmatics/web build

      - name: Service worker was generated
        run: test -f apps/web/dist/sw.js
